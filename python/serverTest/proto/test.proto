// pip install protobuf==3.20.3 --upgrade, else does not work with later versions. protoc is too old? but it is the latest version.
syntax = "proto3";

// Complete program to call Ceres on: read in python, send to server that runs optimization.
message program_proto {
  repeated double cameras = 1; // 3d, cameras_s init is by cameras. later extra input.
  repeated double landmarks = 2; // 9d
  repeated double observations = 3; // 2d
  repeated int32 cam_id = 4; // per observation 1 cam
  repeated int32 lm_id = 5;  // per observation 1 landmark
  int32 iterations = 6;
  int32 cluster_id = 7;
  float init_l = 8;
  float be = 9;
  repeated float unorm = 10;
  repeated float vnorm = 11;
  repeated int32 unique_cameras = 12; // should not be many -- if any ever. One could pack cams < 10 lms in one cluster == lms in cam are put in one cluster.
  int32 num_clusters = 13;
  uint64 run_id = 14;
  uint64 phase_id = 15;
  repeated double camera_transform = 16; // optional row-major 9x9 matrix per camera
  bool scalar_proximal_prior = 17; // use rho * I instead of a Hessian-derived DRS metric
  double proximal_rho = 18;
  bool ceres_local_solver = 19;
  bool split_camera_penalty = 20;
  double proximal_rho_intrinsics = 21;
  int32 local_linear_solver = 22; // 0=nesterov, 1=schur_pcg
  int32 trust_region_policy = 23; // 0=drs, 1=daba
  bool persistent_trust_region = 24;
  int32 objective_model = 25; // 0=standard Snavely pixels, 1=DABA regularized ray
  repeated double initial_focal = 26;
  double block_curvature_multiplier = 27; // 0=legacy be-dependent schedule, >0=fixed JtJ multiplier
  int32 metric_diagnostic_iterations = 28;
  int32 landmark_refinement_steps = 29;
  repeated uint32 global_camera_id = 30; // local camera slot to global camera identifier
  int32 nesterov_max_iterations = 31;
  double nesterov_stop_tolerance = 32;
}

// sent once
message preconditioning_proto {
  int32 cluster_id = 1;
  repeated double unorm = 2; // must be double
  repeated float vnorm = 3;
  repeated double camera_transform = 4; // optional row-major 9x9 matrix per camera
  repeated double cameras = 5; // optional post-bootstrap scaled camera state
}

// message solution_proto {
//   repeated float cameras = 1; // 3d
//   repeated float landmarks = 2; // 9d
// }

// we only return new solution for cameras -- later stepsize as well.
// Test: if we send cameras, we use current program , update cam buffer only and repeat.
// message camera_proto {
//   repeated double cameras = 1; // 3d
// }

// send from master to client
message prox_cluster_proto {
  repeated double cameras   = 1; // 3d actually not needed mostly/always?
  repeated double cameras_s = 2; // 3d
  float be = 3;
  int32 cluster_id = 4;
  int32 revert_lm = 5; // 1=last, 2=legacy best, 3=keep restored accepted state
  uint64 run_id = 6;
  uint64 phase_id = 7;
  bool scalar_proximal_prior = 8;
  double proximal_rho = 9;
  bool ceres_local_solver = 10;
  bool split_camera_penalty = 11;
  double proximal_rho_intrinsics = 12;
  int32 local_linear_solver = 13;
  int32 trust_region_policy = 14;
  bool persistent_trust_region = 15;
  double trust_region_recovery_ratio = 16;
  repeated double landmarks = 17; // optional physical landmarks for coherent recovery
  double block_curvature_multiplier = 18;
  int32 metric_diagnostic_iterations = 19;
  int32 landmark_refinement_steps = 20;
  bool omit_landmarks = 21; // retain solved landmarks in the worker only
  bool retain_cameras = 22; // use the current worker-owned local camera state
  bool revert_cameras = 23; // restore the pre-oracle local camera state
  bool return_consensus_rhs = 24; // packed M(2u-s) shadow contribution
  bytes cameras_f64 = 25; // optional packed little-endian float64 camera state
  bytes cameras_s_f64 = 26; // optional packed little-endian float64 DRS centers
  bool single_node_consensus = 27; // reduce full-block consensus inside this server
  double consensus_relaxation = 28;
  int32 nesterov_max_iterations = 29;
  double nesterov_stop_tolerance = 30;
  // clustering: lms by cam. # lms that can fill up cam in cl.
}

// return message from client to master
message return_cluster_proto {
  // repeated float cameras   = 1; // 3d
  // repeated float landmarks = 2; // temporary
  // repeated float step_size = 3;
  repeated double cameras  = 1; // 3d, must be double
  repeated double landmarks = 2;
  repeated float step_size = 3; // can be float -- actually same perf .. haeh? compress to 2048 or float16
  int32 cluster_id = 4;
  float cost = 5;
  uint64 run_id = 6;
  uint64 phase_id = 7;
  int32 objective_model = 8;
  double transformed_lipschitz_estimate = 9;
  double transformed_lipschitz_residual = 10;
  int32 metric_diagnostic_iterations = 11;
  double camera_proximal_defect_squared = 12;
  double landmark_proximal_defect_squared = 13;
  double proximal_defect_squared = 14;
  bytes cameras_f64 = 15; // packed native little-endian float64 camera state
  bytes landmarks_f64 = 16; // packed native little-endian float64 physical landmarks
  bytes step_size_f32 = 17; // packed native little-endian float32 camera metric blocks
  bytes step_size_upper_f32 = 18; // packed upper triangle: 45 float32 values per camera
  bytes consensus_rhs_f64 = 19; // packed float64 M(2u-s), 9 values per camera
  bytes consensus_f64 = 20; // leader-only packed global float64 consensus
  double consensus_fixed_point_squared = 21;
  double consensus_proximal_displacement_squared = 22;
  double consensus_reflection_projection_squared = 23;
  double consensus_center_step_squared = 24;
  double consensus_splitting_term = 25;
  bool has_single_node_consensus = 26;
}

// send to get cost
message cost_proto {
  repeated double cameras = 1; // 3d, bad is not double -- weird.
  int32 cluster_id = 2;
  int32 revert_lm = 3; // only for cost, revert back after.
  uint64 run_id = 4;
  uint64 phase_id = 5;
  repeated double landmarks = 6; // explicit physical landmark state for reproducible cost evaluation
  int32 landmark_refinement_steps = 7;
  bool omit_landmarks = 8; // return only the precise cost for routine evaluation
  bool preserve_cameras = 9; // restore resident local cameras after evaluation
  bytes cameras_f64 = 10; // optional packed little-endian float64 camera state
}

message return_cost_proto {
  float cost = 1;
  int32 cluster_id = 2;
  uint64 run_id = 3;
  uint64 phase_id = 4;
  repeated double landmarks = 5; // physical landmarks used for this cost
  double precise_cost = 6;
}

message best_cost_proto {
  float cost = 1;
  int32 cluster_id = 2;
  repeated double landmarks = 3; // exact physical landmarks associated with cost
}

message landmark_state_proto {
  enum operation_type {
    LANDMARK_STATE_UNSPECIFIED = 0;
    SAVE_NOMINAL = 1;
    RESTORE_NOMINAL = 2;
    DISCARD_NOMINAL = 3;
    MATERIALIZE_CURRENT = 4;
    SAVE_ACCEPTED = 5;
    RESTORE_ACCEPTED = 6;
    SAVE_BEST = 7;
    MATERIALIZE_BEST = 8;
    RESTORE_NOMINAL_ROUNDTRIP = 9;
  }
  int32 cluster_id = 1;
  uint64 run_id = 2;
  uint64 phase_id = 3;
  uint64 state_id = 4;
  operation_type operation = 5;
}

message landmark_state_reply_proto {
  int32 cluster_id = 1;
  uint64 run_id = 2;
  uint64 phase_id = 3;
  uint64 state_id = 4;
  bytes landmarks_f64 = 5; // packed physical landmarks for explicit materialization
}

// can be one of messages. so proto converts to correct message. client messages server messages
message request_proto {
    oneof options {
        program_proto program = 1;
        //camera_proto cameras = 2;
        prox_cluster_proto update = 3;
        cost_proto cost_update = 4;
        preconditioning_proto preconditioning_update = 5;
        best_cost_proto best_cost = 6;
        landmark_state_proto landmark_state = 7;
  }
}

